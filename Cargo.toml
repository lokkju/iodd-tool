[workspace]
resolver = "3"
members = ["crates/ntfs-contig", "crates/iodd"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Polyform-Shield-1.0.0"
repository = "https://github.com/lokkju/iodd-tool"

[workspace.dependencies]
ntfs-contig = { path = "crates/ntfs-contig", version = "0.1.0", default-features = false }

clap = { version = "4", features = ["derive"] }
thiserror = "2"
libc = "0.2"
nix = { version = "0.29", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
